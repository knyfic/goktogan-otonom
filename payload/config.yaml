# Payload sistemi konfigürasyonu
# Bu dosya Ubuntu (mission) tarafı için referans alınır.
# Raspberry Pi tarafında raspberry-pi-5/config/payload.yaml kullanılır.

# ── Backend seçimi ──────────────────────────────────────────────────────────
# Bu değeri değiştirerek hangi donanımın kullanılacağını belirle.
# main.py bu değeri okur — kod içinde magic string yoktur.
#
#   simulation  → SimulationBackend  (Gazebo, GPIO yok)
#   hil         → RemoteRPiBackend   (Ubuntu → Wi-Fi → Raspberry Pi)
#   real        → LocalRPiBackend    (Raspberry Pi üzerinde, doğrudan GPIO)
backend: hil

# ── Kamera notu ─────────────────────────────────────────────────────────────
# Kamera çözünürlüğü ve FOV config.py içinde tanımlıdır:
#   CAMERA_WIDTH_PX, CAMERA_HEIGHT_PX, CAMERA_HORIZONTAL_FOV_DEG, CAMERA_VERTICAL_FOV_DEG
# Gerçek kamera kaynağı (USB index/device path) ve FPS de config.py'de:
#   REAL_CAMERA_SOURCE, REAL_CAMERA_FPS
# Bu değerleri burada tekrar tanımlamak gereksiz çoğalmaya yol açar.

# ── Remote backend (HIL modu) ───────────────────────────────────────────────
# backend: hil seçildiğinde bu blok okunur.
# host ve port buradan gelir — main.py içinde IP adresi yoktur.
remote:
  host: 192.168.1.21   # Raspberry Pi'nin IP'si veya hostname'i
  port: 5700
  timeout_s: 180.0     # NOT: pickup (stepper ↓+↑) ~28sn sürer (11429 adım × 2 yön). Büyük tutun.

# ── HIL modu kamera kaynağı seçimi ──────────────────────────────────────────
# hil_camera:
#   gazebo     → Geleneksel HIL: kamera Gazebo topic'ten gelir (CAMERA_TOPIC)
#   remote_rpi → GERÇEK HIL: Raspberry Pi üzerindeki Camera Module 3'ten
#                TCP/Wi-Fi üzerinden gerçek frame alınır.
#                Mekanik (İHA + GPS) hala Gazebo.
# remote_camera:  hil_camera: remote_rpi iken Ubuntu'nun bağlanacağı RPi adresi
hil_camera: remote_rpi
remote_camera:
  host: 192.168.1.21   # Raspberry Pi (payload.remote.host ile AYNI olmalı)
  port: 5701           # RPi camera_server portu (payload 5700 yanında)

# ── Stepper motor ───────────────────────────────────────────────────────────
stepper:
  # GPIO pinleri (BCM mode)
  step_pin:   13
  enable_pin: 19
  dir_pin:    26

  # Yön değişimi sonrası kurulum gecikmesi
  dir_setup_delay_s: 0.005

  # Rampa profili — Arduino referans kodundan (en iyi çalışan değerler)
  # Step pulse: 10µs HIGH tetik + delay µs LOW bekleme
  start_delay_us:  1500    # µs — başlangıç pulse aralığı (yavaş başla)
  target_delay_us: 1200    # µs — hedef pulse aralığı (tam hız)
  ramp_steps:       250    # kaç adımda hedefe ulaş (başta ve sonda)

  # ── Mekanik parametreler ────────────────────────────────────────────────
  # Mil (leadscrew) özellikleri:
  #   mm_per_revolution   = 0.7      → Mil 1 tam devir = 0.7 mm doğrusal hareket
  #   steps_per_revolution = 200     → NEMA 17 full-step (1.8°/adım)
  #   mm_per_step         = 0.0035   → 0.7 / 200 = 0.0035 mm / adım
  #
  # Toplam seyahat: 40 mm
  #   steps_for_travel = travel_mm / (mm_per_revolution / steps_per_revolution)
  #                    = 40 / (0.7 / 200)
  #                    = 11428.571  →  11429 (tam sayıya yuvarlandı)
  #
  # Tahmini süre: 11429 adım × ortalama ~1210µs/adım ≈ 13.8 sn / yön
  mm_per_revolution:    0.7
  steps_per_revolution: 200
  travel_mm:            40.0
  steps_for_travel:     11429

  # ENABLE polarity (DRV8834)
  enable_active_low: true

# ── Mıknatıslar ─────────────────────────────────────────────────────────────
magnets:
  magnet_1_pin: 5    # Mavi kablo
  magnet_2_pin: 6    # Kırmızı kablo

  # HIGH = tutma (HOLD), LOW = bırakma (RELEASE)
  hold_level:    HIGH
  release_level: LOW

  # Başlangıç durumu: her iki mıknatıs da tutma konumunda
  initial_magnet_1: ON
  initial_magnet_2: ON

# ── Payload sıralaması ──────────────────────────────────────────────────────
# Hangi renk payload hangi mıknatısa bağlı?
# Fiziksel kuruluma göre ayarla.
#
# Örnek:
#   Mavi altıgen hedefine KIRMIZI payload bırakılmalı
#   → KIRMIZI payload Magnet 1'de (GPIO 5, mavi kablo)
#
# Bunu değiştirmek için yalnızca bu iki satırı güncelle:
payload_color_map:
  RED:  magnet_1   # KIRMIZI payload → Magnet 1 (GPIO 5)
  BLUE: magnet_2   # MAVİ payload    → Magnet 2 (GPIO 6)

# ── GPIO chip (backend: real için) ──────────────────────────────────────────
# Raspberry Pi 5'te /dev/gpiochip0 varsayılandır.
gpio:
  chip: 0
