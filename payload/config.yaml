# Payload sistemi konfigürasyonu
# Bu dosya Ubuntu (mission) tarafı için referans alınır.
# Raspberry Pi tarafında raspberry-pi-5/config/payload.yaml kullanılır.

# ── Backend seçimi ──────────────────────────────────────────────────────────
# Bu değeri değiştirerek hangi donanımın kullanılacağını belirle.
# main.py bu değeri okur — kod içinde magic string yoktur.
#
#   simulation  → SimulationBackend  (Gazebo, GPIO yok)
#   hil         → RemoteRPiBackend   (Ubuntu → Wi-Fi → Raspberry Pi)
#   real        → LocalRPiBackend    (Raspberry Pi üzerinde, doğrudan GPIO)
backend: hil

# ── Kamera notu ─────────────────────────────────────────────────────────────
# Kamera çözünürlüğü ve FOV config.py içinde tanımlıdır:
#   CAMERA_WIDTH_PX, CAMERA_HEIGHT_PX, CAMERA_HORIZONTAL_FOV_DEG, CAMERA_VERTICAL_FOV_DEG
# Gerçek kamera kaynağı (USB index/device path) ve FPS de config.py'de:
#   REAL_CAMERA_SOURCE, REAL_CAMERA_FPS
# Bu değerleri burada tekrar tanımlamak gereksiz çoğalmaya yol açar.

# ── Remote backend (HIL modu) ───────────────────────────────────────────────
# backend: hil seçildiğinde bu blok okunur.
# host ve port buradan gelir — main.py içinde IP adresi yoktur.
remote:
  host: 192.168.1.21   # Raspberry Pi'nin IP'si veya hostname'i
  port: 5700
  timeout_s: 180.0     # NOT: release işlemi ~70sn sürer (17143 adım × 2 yön). Büyük tutun.

# ── Stepper motor ───────────────────────────────────────────────────────────
stepper:
  # GPIO pinleri (BCM mode)
  step_pin:   13
  enable_pin: 19
  dir_pin:    26

  # Yön değişimi sonrası kurulum gecikmesi
  dir_setup_delay_s: 0.005

  # Rampa profili — Arduino referans kodundan (en iyi çalışan değerler)
  # Step pulse: 10µs HIGH tetik + delay µs LOW bekleme
  start_delay_us:  1500    # µs — başlangıç pulse aralığı (yavaş başla)
  target_delay_us: 1200    # µs — hedef pulse aralığı (tam hız)
  ramp_steps:       250    # kaç adımda hedefe ulaş (başta ve sonda)

  # Tam hareket mesafesi
  # Arduino: stepsPerRevolution = 10000
  steps_for_travel: 10000

  # ENABLE polarity (DRV8834)
  enable_active_low: true

# ── Mıknatıslar ─────────────────────────────────────────────────────────────
magnets:
  magnet_1_pin: 5    # Mavi kablo
  magnet_2_pin: 6    # Kırmızı kablo

  # HIGH = tutma (HOLD), LOW = bırakma (RELEASE)
  hold_level:    HIGH
  release_level: LOW

  # Başlangıç durumu: her iki mıknatıs da tutma konumunda
  initial_magnet_1: ON
  initial_magnet_2: ON

# ── Payload sıralaması ──────────────────────────────────────────────────────
# release_payload ilk çağrıldığında hangisi bırakılır?
# "magnet_1_first": true  → 1. bırakma = Magnet 1 OFF
# "magnet_1_first": false → 1. bırakma = Magnet 2 OFF
payload_sequence:
  magnet_1_first: true

# ── GPIO chip (backend: real için) ──────────────────────────────────────────
# Raspberry Pi 5'te /dev/gpiochip0 varsayılandır.
gpio:
  chip: 0
