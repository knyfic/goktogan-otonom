# Raspberry Pi 5 — Payload Donanım Konfigürasyonu
# Bu dosya yalnızca Raspberry Pi üzerinde çalışan kodlar tarafından kullanılır.
# Ubuntu tarafındaki payload/config.yaml ile karıştırma.

# ── TCP Servis ───────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0   # Tüm arayüzlerden bağlantı kabul et
  port: 5700
  max_connections: 1   # Aynı anda yalnızca bir kontrol kaynağı

# ── Kamera Akış Servisi (HIL testi için GERÇEK Raspberry Pi Camera Module 3) ─
# HIL modunda Ubuntu mission kodu buraya bağlanır ve gerçek kameradan frame alır.
# Mekanik (İHA + GPS) hala Gazebo'da, kamera ise RPi Cam 3 (CSI port 0 / CAM0).
camera_server:
  enable: true            # false → kamera servisini başlatma (eski HIL için uyumluluk)
  host: 0.0.0.0           # Tüm arayüzlerden bağlantı kabul et
  port: 5701              # Payload TCP (5700) yanında ikinci port
  camera_num: 0           # 0 = CAM0 (CSI port 0), kullanıcının belirttiği fiziksel port
  width: 1920             # CAMERA_WIDTH_PX ile tutarlı
  height: 1080            # CAMERA_HEIGHT_PX ile tutarlı
  fps: 30                 # Hedef FPS (RPi Cam 3 1080p30 rahat destekler)
  jpeg_quality: 80        # 1-100 — daha yüksek: daha net, daha fazla bant genişliği

# ── Stepper motor (DRV8834 — Indexer / Full-step mode) ──────────────────────
stepper:
  step_pin:   13   # BCM
  enable_pin: 19   # BCM
  dir_pin:    26   # BCM

  # Yön değişimi sonrası kurulum gecikmesi
  dir_setup_delay_s: 0.005

  # Rampa profili — Arduino referans kodundan (en iyi çalışan değerler)
  # Step pulse: 10µs HIGH tetik + delay µs LOW bekleme
  start_delay_us:  1500    # µs — başlangıç pulse aralığı (yavaş başla)
  target_delay_us: 1200    # µs — hedef pulse aralığı (tam hız)
  ramp_steps:       250    # kaç adımda hedefe ulaş (başta ve sonda)

  # ── Mekanik parametreler ────────────────────────────────────────────────
  # Mil (leadscrew) özellikleri:
  #   mm_per_revolution   = 0.7      → Mil 1 tam devir = 0.7 mm doğrusal hareket
  #   steps_per_revolution = 200     → NEMA 17 full-step (1.8°/adım)
  #   mm_per_step         = 0.0035   → 0.7 / 200 = 0.0035 mm / adım
  #
  # Toplam seyahat: 40 mm
  #   steps_for_travel = travel_mm / (mm_per_revolution / steps_per_revolution)
  #                    = 40 / (0.7 / 200)
  #                    = 11428.571  →  11429 (tam sayıya yuvarlandı)
  #
  # Tahmini süre: 11429 adım × ortalama ~1210µs/adım ≈ 13.8 sn / yön
  mm_per_revolution:    0.7
  steps_per_revolution: 200
  travel_mm:            40.0
  steps_for_travel:     11429

  # ENABLE polarity: LOW = aktif (DRV8834 varsayılanı)
  enable_active_low: true

# ── Mıknatıslar ──────────────────────────────────────────────────────────────
magnets:
  magnet_1_pin: 5   # BCM — Mavi kablo
  magnet_2_pin: 6   # BCM — Kırmızı kablo

  # HIGH = HOLD (tutma), LOW = RELEASE (bırakma)
  hold_level:    HIGH
  release_level: LOW

  initial_magnet_1: ON
  initial_magnet_2: ON

# ── Payload sıralaması ──────────────────────────────────────────────────────
payload_color_map:
  RED:  magnet_1   # KIRMIZI payload → Magnet 1 (GPIO 5)
  BLUE: magnet_2   # MAVİ payload    → Magnet 2 (GPIO 6)

# ── GPIO ─────────────────────────────────────────────────────────────────────
gpio:
  chip: 0            # /dev/gpiochip0 (RPi 5 varsayılanı)
  # NOT: lgpio BCM pin numaralarını doğrudan kullanır,
  # RPi.GPIO gibi setmode(BCM) gerekmez.
